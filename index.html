<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Logo Bumdes Amanah</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f9f9f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 22px;
      color: #333;
    }

    a {
      display: inline-block;
      margin-top: 15px;
      font-size: 18px;
      color: #007bff;
      text-decoration: none;
      border: 1px solid #007bff;
      padding: 10px 16px;
      border-radius: 8px;
      transition: 0.3s;
    }

    a:hover {
      background-color: #007bff;
      color: white;
    }

    #gambar {
      display: none;
      margin-top: 30px;
      max-width: 90%;
      height: auto;
      border: 1px solid #ccc;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>

  <h1>Selamat Datang di<br>LOGO BUMDES AMANAH DESA BLOK 15</h1>

  <a href="#" onclick="document.getElementById('gambar').style.display='block'; return false;">
    Link Logo Bumdes Amanah
  </a>

  <img id="gambar" src="https://i.imgur.com/wtvDZZ3.jpeg" alt="Logo Bumdes Amanah">

</body>
</html>
